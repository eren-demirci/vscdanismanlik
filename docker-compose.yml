services:
  app:
    container_name: vsc-danismanlik
    build:
      context: .
    ports:
      - "3031:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      - postgres
  postgres:
    image: postgres:latest
    container_name: vsc-postgres
    environment:
      POSTGRES_USER: vsc_user
      POSTGRES_PASSWORD: vsc_password
      POSTGRES_DB: vsc_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-news.sql:/docker-entrypoint-initdb.d/01-init-news.sql:ro
      - ./db/migrations/20260505_add_content_html_to_news.sql:/docker-entrypoint-initdb.d/02-add-content-html.sql:ro
      - ./db/migrations/20260505_add_image_url_to_news.sql:/docker-entrypoint-initdb.d/03-add-image-url.sql:ro
      - ./db/init-duyurular.sql:/docker-entrypoint-initdb.d/04-init-duyurular.sql:ro

volumes:
  postgres_data:

